services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      TZ: "${TZ:-America/New_York}"
      N8N_PROTOCOL: "${N8N_PROTOCOL:-http}"
      N8N_HOST: "${N8N_HOST:-localhost}"
      N8N_PORT: 5678
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:-replace_with_a_32_plus_character_key}"
      # Workflow exports use $env for internal service URLs and notification settings.
      # Keep this local instance limited to trusted workflows.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_WEBHOOK_URL: "${N8N_WEBHOOK_URL:-http://localhost:5678/}"
      GENERIC_TIMEZONE: "${TZ:-America/New_York}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_CHAT_MODEL: "${OLLAMA_CHAT_MODEL:-qwen3:4b}"
      OLLAMA_EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      NOTIFICATION_EMAIL: "${NOTIFICATION_EMAIL:-}"
      WORKER_BASE_URL: "http://worker:8080"
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-http://searxng:8080}"
      CRAWL4AI_BASE_URL: "${CRAWL4AI_BASE_URL:-http://crawl4ai:11235}"
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:-}"
      QDRANT_URL: "${QDRANT_URL:-http://qdrant:6333}"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/credentials:/credentials
    depends_on:
      worker:
        condition: service_healthy
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
      searxng:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    restart: unless-stopped
    environment:
      TZ: "${TZ:-America/New_York}"
      CRM_DB_PATH: "${CRM_DB_PATH:-/data/recruiting.db}"
      CRM_SCHEMA_PATH: "${CRM_SCHEMA_PATH:-/app/database/schema.sql}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_CHAT_MODEL: "${OLLAMA_CHAT_MODEL:-qwen3:4b}"
      OLLAMA_EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"
      QDRANT_URL: "${QDRANT_URL:-http://qdrant:6333}"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-recruiting_memory}"
      EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:-768}"
    ports:
      - "8087:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "recruiting_ai.healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      SEARXNG_BASE_URL: "http://localhost:8088/"
    volumes:
      - ./docker/searxng:/etc/searxng:ro

  crawl4ai:
    image: unclecode/crawl4ai:latest
    restart: unless-stopped
    ports:
      - "11235:11235"
    environment:
      CRAWL4AI_API_TOKEN: "${CRAWL4AI_API_TOKEN:-}"
    shm_size: "1gb"

  appsmith:
    image: appsmith/appsmith-ce:latest
    restart: unless-stopped
    profiles:
      - dashboard
    ports:
      - "8089:80"
      - "8443:443"
    volumes:
      - appsmith_data:/appsmith-stacks

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    profiles:
      - maintenance
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --schedule "0 0 4 * * *"

volumes:
  n8n_data:
  ollama_data:
  qdrant_data:
  appsmith_data:
